<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glossary — AI &amp; LLM Systems 101</title>
    <meta name="description" content="Searchable glossary of key AI and LLM terms." />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      window.COURSE_BASE = "";
      window.COURSE_PAGE = "glossary";
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header id="site-header"></header>

    <main id="main" class="page">
      <h1>Glossary</h1>
      <p class="lede">
        Key terms used throughout the course, in plain language. Start typing to
        filter the list as you go.
      </p>

      <div class="glossary-search-wrap">
        <label for="glossary-search" class="visually-hidden">Search glossary terms</label>
        <input
          type="search"
          id="glossary-search"
          placeholder="Search terms… (e.g. token, RAG, embedding)"
          autocomplete="off"
          aria-describedby="glossary-count"
        />
        <p id="glossary-count" role="status" aria-live="polite"></p>
      </div>

      <p id="glossary-empty" hidden class="text-muted">
        No terms match your search. Try a different word.
      </p>

      <dl id="glossary-list" class="glossary-list">
        <noscript>
          <p>This glossary uses JavaScript for search. Please enable JavaScript.</p>
        </noscript>
      </dl>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/course.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/glossary.js"></script>
  </body>
</html>
